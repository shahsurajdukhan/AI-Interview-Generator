<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <button type="button" id="themeToggle" aria-label="Toggle dark mode">
        <span class="theme-icon" aria-hidden="true">🌙</span>
        <span class="theme-text">Dark</span>
    </button>

    <div class="container">
        <h1>AI Interview Generator</h1>
        <p>Generate Interview Questions Using AI.</p>
        <div class="form">
            <label for="role">Job Role</label>
            <select id="role">
                <option value="Frontend Developer">Frontend Developer</option>
                <option value="Backend Developer">Backend Developer</option>
                <option value="Full Stack Developer">Full Stack Developer</option>
                <option value="Data Scientist">Data Scientist</option>
            </select>

            <label for="difficulty">Difficulty</label>
            <select id="difficulty">
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
            </select>

            <label for="number">Number of Questions</label>
            <input type="number" id="number" value="5" min="1" max="10">

            <button id="generateBtn">Generate Questions</button>
        </div>
        <div id="loading"></div>
        <div id="questions"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
